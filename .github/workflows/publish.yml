name: Publish taut-shape to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to verify
        required: true

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

jobs:
  test:
    name: Test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: workspace/taut-shape-ts
      - uses: actions/checkout@v6
        with:
          repository: owebeeone/taut-shape
          path: workspace/taut-shape
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: workspace/taut-shape-ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: workspace/taut-shape-ts
      - run: pnpm typecheck
        working-directory: workspace/taut-shape-ts
      - run: pnpm test
        working-directory: workspace/taut-shape-ts
      - run: pnpm build
        working-directory: workspace/taut-shape-ts
      - name: Smoke-test packed consumer install
        working-directory: workspace/taut-shape-ts
        run: |
          package_dir=$(mktemp -d)
          npm pack --pack-destination "$package_dir"
          package_tarball="owebeeone-taut-shape-$(node -p "require('./package.json').version").tgz"
          npm install --prefix "$package_dir/consumer" "$package_dir/$package_tarball"
          cd "$package_dir/consumer"
          node --input-type=module -e "const m = await import('@owebeeone/taut-shape'); if (!m.LogNode || !m.AtomNode || !m.StreamNode || !m.SwmrNode || !m.CrdtNode || !m.ValueNode) throw new Error('missing public shape export')"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # Trusted publishing needs npm 11.5.1 or later; the major version is pinned, not whatever is latest.
      - name: Select an npm CLI with trusted-publishing support
        run: npm install --global npm@11
      - name: Require tag/package version agreement
        run: |
          node -e 'const p=require("./package.json"); const t=process.env.RELEASE_TAG.replace(/^v/, ""); if (p.version !== t) throw new Error(`package ${p.version} != tag ${t}`)'
      - name: Publish if this immutable version is absent
        run: |
          package_spec=$(node -p "const p=require('./package.json'); p.name + '@' + p.version")
          if npm view "$package_spec" version >/dev/null 2>&1; then
            echo "$package_spec is already published"
          else
            npm publish --access public
          fi
