name: Publish taut-shape to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke-test packed consumer install
        run: |
          package_dir=$(mktemp -d)
          npm pack --pack-destination "$package_dir"
          package_tarball="owebeeone-taut-shape-$(node -p "require('./package.json').version").tgz"
          npm install --prefix "$package_dir/consumer" "$package_dir/$package_tarball"
          cd "$package_dir/consumer"
          node --input-type=module -e "const m = await import('@owebeeone/taut-shape'); if (!m.LogNode || !m.AtomNode || !m.StreamNode || !m.SwmrNode || !m.CrdtNode || !m.ValueNode) throw new Error('missing public shape export')"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Select an npm CLI with trusted-publishing support
        run: npm install --global npm@latest
      - name: Require tag/package version agreement
        run: |
          node -e 'const p=require("./package.json"); const t=process.env.GITHUB_REF_NAME.replace(/^v/, ""); if (p.version !== t) throw new Error(`package ${p.version} != tag ${t}`)'
      - run: npm publish --access public
