name: Publish taut-shape to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Select an npm CLI with trusted-publishing support
        run: npm install --global npm@latest
      - name: Require tag/package version agreement
        run: |
          node -e 'const p=require("./package.json"); const t=process.env.GITHUB_REF_NAME.replace(/^v/, ""); if (p.version !== t) throw new Error(`package ${p.version} != tag ${t}`)'
      - run: npm publish --access public
        env:
          # A token is needed only to bootstrap the package. Once the package
          # exists, configure npm Trusted Publishing for publish.yml and remove
          # this secret; npm will use the job's OIDC token automatically.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
